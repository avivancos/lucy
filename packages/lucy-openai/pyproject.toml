[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy-openai"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "lucy",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "websockets>=13.0",
]

[project.entry-points."lucy.plugins"]
openai = "lucy_openai:PLUGIN"

[tool.setuptools.packages.find]
where = ["src"]
