[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy-cloud"
version = "0.1.0"
description = "Open telemetry client for the Lucy platform."
requires-python = ">=3.9"
dependencies = [
  "lucy",
  "httpx>=0.27.0",
]

[project.entry-points."lucy.exporters"]
cloud = "lucy_cloud.exporter:CloudTraceExporter.from_env"

[tool.setuptools.packages.find]
where = ["src"]
