[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy"
version = "0.1.0"
description = "Python-first voice agent infrastructure platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "uvicorn[standard]>=0.30.0",
  "opentelemetry-api>=1.25.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "asyncpg>=0.29.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "redis>=5.0.0",
  "ruff>=0.6.0",
]
checkpoint-postgres = [
  "asyncpg>=0.29.0",
]
checkpoint-redis = [
  "redis>=5.0.0",
]
headroom = [
  "headroom-ai[all]>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not live'"
markers = [
  "live: hits real provider endpoints; requires API keys",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
