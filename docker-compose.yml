services:
  lucy-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn lucy.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "8000:8000"
    volumes:
      # Mount the working tree so `docker compose run --rm lucy-api pytest`
      # validates the real repo. Several contract tests resolve ROOT to the
      # repo root and read files the image does not COPY (agents.md, MEMORY.md,
      # docs/, backlog/, LICENSE, NOTICE, infra/, media-gateway-rust/).
      # Installed deps live in site-packages and are unaffected; `lucy` stays
      # importable via the editable install pointing at /app/src.
      - .:/app
    depends_on:
      - postgres
      - redis

  lucy-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m lucy.worker
    env_file: .env.example
    depends_on:
      - postgres
      - redis

  lucy-media-gateway:
    build:
      context: ./media-gateway-rust
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lucy
      POSTGRES_PASSWORD: lucy
      POSTGRES_DB: lucy
    # Reachable in-network as `postgres:5432`; not published to the host so the
    # documented `docker compose run --rm lucy-api pytest` and `up` do not clash
    # with another local Postgres on 5432. Add a host mapping if you need it.

  redis:
    image: redis:7-alpine
    # Reachable in-network as `redis:6379`; not published to the host (see above).

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

