services:
  lucy-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn lucy.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "${LUCY_API_HOST_PORT:-8000}:8000"
    volumes:
      # Mount the working tree so `docker compose run --rm lucy-api pytest`
      # validates the real repo. Several contract tests resolve ROOT to the
      # repo root and read files the image does not COPY (agents.md, MEMORY.md,
      # docs/, backlog/, LICENSE, NOTICE, infra/, media-gateway-rust/).
      # Installed deps live in site-packages and are unaffected; `lucy` stays
      # importable via the editable install pointing at /app/src.
      - .:/app
    depends_on:
      - postgres
      - redis

  lucy-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m lucy.worker
    env_file: .env.example
    depends_on:
      - postgres
      - redis

  lucy-media-gateway:
    build:
      context: ./media-gateway-rust
      dockerfile: Dockerfile
    environment:
      LUCY_SESSION_WS_URL: ws://lucy-api:8000/v1/session/ws
      LUCY_GATEWAY_MODE: serve
    ports:
      - "8081:8081"
    depends_on:
      - lucy-api

  lucy-gateway-tests:
    image: rust:1.82-bookworm
    profiles: ["gateway-it"]
    working_dir: /app
    environment:
      LUCY_CONTROL_SCHEMA_DIR: /fixtures/control_schema
      LUCY_AUDIO_FIXTURE_WAV: /fixtures/audio/booking_caller_8k.wav
      LUCY_AUDIO_FIXTURE_TIMELINE: /fixtures/audio/booking_caller.timeline.json
    volumes:
      - ./media-gateway-rust:/app
      - ./tests/fixtures:/fixtures:ro
    command: cargo test

  lucy-gateway-session:
    build:
      context: ./media-gateway-rust
      dockerfile: Dockerfile
    profiles: ["gateway-it"]
    environment:
      LUCY_SESSION_WS_URL: ws://lucy-api:8000/v1/session/ws
      LUCY_GATEWAY_MODE: session-oneshot
      LUCY_AUDIO_FIXTURE_WAV: /fixtures/audio/booking_caller_8k.wav
      LUCY_AUDIO_FIXTURE_TIMELINE: /fixtures/audio/booking_caller.timeline.json
    volumes:
      - ./tests/fixtures/audio:/fixtures/audio:ro
    depends_on:
      - lucy-api

  lucy-dev-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m lucy.transport.dev_gateway_ws
    profiles: ["test"]
    environment:
      LUCY_SESSION_WS_URL: ws://lucy-api:8000/v1/session/ws
    depends_on:
      - lucy-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lucy
      POSTGRES_PASSWORD: lucy
      POSTGRES_DB: lucy
    # Reachable in-network as `postgres:5432`; not published to the host so the
    # documented `docker compose run --rm lucy-api pytest` and `up` do not clash
    # with another local Postgres on 5432. Add a host mapping if you need it.

  redis:
    image: redis:7-alpine
    # Reachable in-network as `redis:6379`; not published to the host (see above).

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
