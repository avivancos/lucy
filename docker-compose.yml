services:
  lucy-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn lucy.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "${LUCY_API_HOST_PORT:-8000}:8000"
    volumes:
      # Mount the working tree so `docker compose run --rm lucy-api pytest`
      # validates the real repo. Several contract tests resolve ROOT to the
      # repo root and read files the image does not COPY (agents.md, MEMORY.md,
      # docs/, backlog/, LICENSE, NOTICE, infra/, media-gateway-rust/).
      # Installed deps live in site-packages and are unaffected; `lucy` stays
      # importable via the editable install pointing at /app/src.
      - .:/app
    depends_on:
      - postgres
      - redis

  lucy-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m lucy.worker
    env_file: .env.example
    depends_on:
      - postgres
      - redis

  lucy-media-gateway:
    build:
      context: ./media-gateway-rust
      dockerfile: Dockerfile
    environment:
      LUCY_SESSION_WS_URL: ws://lucy-api:8000/v1/session/ws
      LUCY_GATEWAY_MODE: serve
    ports:
      - "8081:8081"
    depends_on:
      - lucy-api

  lucy-gateway-tests:
    image: rust:1.82-bookworm
    profiles: ["gateway-it"]
    working_dir: /app
    environment:
      LUCY_CONTROL_SCHEMA_DIR: /fixtures/control_schema
      LUCY_AUDIO_FIXTURE_WAV: /fixtures/audio/booking_caller_8k.wav
      LUCY_AUDIO_FIXTURE_TIMELINE: /fixtures/audio/booking_caller.timeline.json
    volumes:
      - ./media-gateway-rust:/app
      - ./tests/fixtures:/fixtures:ro
    command: cargo test

  lucy-gateway-session:
    build:
      context: ./media-gateway-rust
      dockerfile: Dockerfile
    profiles: ["gateway-it"]
    environment:
      LUCY_SESSION_WS_URL: ws://lucy-api:8000/v1/session/ws
      LUCY_GATEWAY_MODE: session-oneshot
      LUCY_AUDIO_FIXTURE_WAV: /fixtures/audio/booking_caller_8k.wav
      LUCY_AUDIO_FIXTURE_TIMELINE: /fixtures/audio/booking_caller.timeline.json
    volumes:
      - ./tests/fixtures/audio:/fixtures/audio:ro
    depends_on:
      - lucy-api

  lucy-dev-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m lucy.transport.dev_gateway_ws
    profiles: ["test"]
    environment:
      LUCY_SESSION_WS_URL: ws://lucy-api:8000/v1/session/ws
    depends_on:
      - lucy-api

  asterisk:
    image: andrius/asterisk:22@sha256:cc5fce715ec241c588992fbc5372af3a1ae673c6fe48903a49d069223aab68da
    profiles: ["telephony-lab"]
    environment:
      LUCY_TELEPHONY_ARI_PORT: ${LUCY_TELEPHONY_ARI_PORT:-8088}
      LUCY_TELEPHONY_ARI_USER: ${LUCY_TELEPHONY_ARI_USER:-lucy-lab}
      LUCY_TELEPHONY_ARI_PASSWORD: ${LUCY_TELEPHONY_ARI_PASSWORD:-lucy-lab-only}
      LUCY_TELEPHONY_PJSIP_PORT: ${LUCY_TELEPHONY_PJSIP_PORT:-5060}
      LUCY_TELEPHONY_PJSIP_USER: ${LUCY_TELEPHONY_PJSIP_USER:-lucy-lab}
      LUCY_TELEPHONY_PJSIP_PASSWORD: ${LUCY_TELEPHONY_PJSIP_PASSWORD:-lucy-lab-only}
      LUCY_TELEPHONY_RTP_PORT_START: ${LUCY_TELEPHONY_RTP_PORT_START:-10000}
      LUCY_TELEPHONY_RTP_PORT_END: ${LUCY_TELEPHONY_RTP_PORT_END:-10019}
      LUCY_TELEPHONY_AUDIO_SOCKET_HOST: ${LUCY_TELEPHONY_AUDIO_SOCKET_HOST:-lucy-media-gateway}
      LUCY_TELEPHONY_AUDIO_SOCKET_PORT: ${LUCY_TELEPHONY_AUDIO_SOCKET_PORT:-9092}
      LUCY_TELEPHONY_CALL_TIMEOUT_SECONDS: ${LUCY_TELEPHONY_CALL_TIMEOUT_SECONDS:-15}
    entrypoint:
      - python3
      - /opt/lucy-asterisk/scripts/render_config.py
    command:
      - /usr/local/bin/entrypoint.sh
      - /usr/sbin/asterisk
      - -f
      - -T
      - -U
      - asterisk
      - -p
    ports:
      - "127.0.0.1:${LUCY_TELEPHONY_ARI_HOST_PORT:-18088}:${LUCY_TELEPHONY_ARI_PORT:-8088}"
      - "127.0.0.1:${LUCY_TELEPHONY_SIP_HOST_PORT:-15060}:${LUCY_TELEPHONY_PJSIP_PORT:-5060}/udp"
      - "127.0.0.1:${LUCY_TELEPHONY_RTP_PORT_START:-10000}-${LUCY_TELEPHONY_RTP_PORT_END:-10019}:${LUCY_TELEPHONY_RTP_PORT_START:-10000}-${LUCY_TELEPHONY_RTP_PORT_END:-10019}/udp"
    volumes:
      - ./infra/asterisk/config:/opt/lucy-asterisk/config:ro
      - ./infra/asterisk/scripts:/opt/lucy-asterisk/scripts:ro
      - ./infra/asterisk/fixtures/booking_caller_8k.wav:/var/lib/asterisk/sounds/lucy/booking_caller_8k.wav:ro
    tmpfs:
      - /etc/asterisk
    healthcheck:
      test: ["CMD", "/opt/lucy-asterisk/scripts/healthcheck.sh"]
      interval: ${LUCY_TELEPHONY_HEALTH_INTERVAL:-2s}
      timeout: ${LUCY_TELEPHONY_HEALTH_TIMEOUT:-2s}
      retries: ${LUCY_TELEPHONY_HEALTH_RETRIES:-15}
      start_period: ${LUCY_TELEPHONY_HEALTH_START_PERIOD:-2s}

  telephony-caller:
    image: andrius/asterisk:22@sha256:cc5fce715ec241c588992fbc5372af3a1ae673c6fe48903a49d069223aab68da
    profiles: ["telephony-lab"]
    environment:
      LUCY_TELEPHONY_ARI_HOST: ${LUCY_TELEPHONY_ARI_HOST:-asterisk}
      LUCY_TELEPHONY_ARI_PORT: ${LUCY_TELEPHONY_ARI_PORT:-8088}
      LUCY_TELEPHONY_ARI_USER: ${LUCY_TELEPHONY_ARI_USER:-lucy-lab}
      LUCY_TELEPHONY_ARI_PASSWORD: ${LUCY_TELEPHONY_ARI_PASSWORD:-lucy-lab-only}
      LUCY_TELEPHONY_ARI_REQUEST_TIMEOUT_SECONDS: ${LUCY_TELEPHONY_ARI_REQUEST_TIMEOUT_SECONDS:-2}
      LUCY_TELEPHONY_CALL_TIMEOUT_SECONDS: ${LUCY_TELEPHONY_CALL_TIMEOUT_SECONDS:-15}
      LUCY_TELEPHONY_CALL_POLL_INTERVAL_SECONDS: ${LUCY_TELEPHONY_CALL_POLL_INTERVAL_SECONDS:-0.1}
    entrypoint:
      - python3
      - /opt/lucy-asterisk/scripts/originate_call.py
    volumes:
      - ./infra/asterisk/scripts:/opt/lucy-asterisk/scripts:ro
    depends_on:
      asterisk:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lucy
      POSTGRES_PASSWORD: lucy
      POSTGRES_DB: lucy
    # Reachable in-network as `postgres:5432`; not published to the host so the
    # documented `docker compose run --rm lucy-api pytest` and `up` do not clash
    # with another local Postgres on 5432. Add a host mapping if you need it.

  redis:
    image: redis:7-alpine
    # Reachable in-network as `redis:6379`; not published to the host (see above).

  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
